<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:" />
<title>DSH Desktop</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: #0f172a; color: #e2e8f0;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 18px 20px 8px; }
  .grow { flex: 1; min-width: 0; }
  .lang { display: flex; gap: 6px; }
  .lang button { padding: 5px 10px; font-size: 12px; }
  .lang button.active { background: #134e4a; color: #5eead4; border-color: #2dd4bf55; }
  .mark {
    width: 40px; height: 40px; border-radius: 10px; background: #1e293b;
    display: flex; align-items: center; justify-content: center;
    color: #2dd4bf; font: 700 18px/1 Consolas, monospace; letter-spacing: -1px;
  }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .sub { font-size: 12px; color: #64748b; margin-top: 2px; }
  #identity { padding: 0 20px 8px; font-size: 12px; color: #94a3b8; word-break: break-all; }
  .status { display: flex; align-items: center; gap: 8px; padding: 4px 20px 10px; font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #f59e0b; flex-shrink: 0; }
  .dot.ready { background: #34d399; }
  .dot.bad { background: #f87171; }
  .dot.starting { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  #progress { display: none; height: 4px; margin: 0 20px 8px; background: #1e293b; overflow: hidden; border-radius: 2px; }
  #progress.visible { display: block; }
  #progress .bar { height: 100%; width: 35%; background: #2dd4bf; animation: slide 1s linear infinite; }
  @keyframes slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(380%); } }
  .log-label { padding: 0 20px 4px; font-size: 11px; color: #475569; }
  pre {
    flex: 1; margin: 0 20px; padding: 12px; overflow: auto;
    background: #020617; border: 1px solid #1e293b; border-radius: 8px;
    font: 12px/1.5 Consolas, "Courier New", monospace; color: #94a3b8; white-space: pre-wrap; word-break: break-all;
  }
  footer { display: flex; gap: 10px; align-items: center; padding: 12px 20px 16px; flex-wrap: wrap; }
  button {
    background: #134e4a; color: #5eead4; border: 1px solid #2dd4bf55;
    padding: 7px 18px; border-radius: 7px; font-size: 13px; cursor: pointer;
  }
  button:hover { background: #115e59; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary { background: #1e293b; color: #94a3b8; border-color: #334155; }
  .hint { font-size: 12px; color: #475569; }
  #setup {
    display: none; margin: 0 20px 10px; padding: 12px 14px;
    border: 1px solid #334155; border-radius: 8px; background: #111827; font-size: 13px; line-height: 1.55;
  }
  #setup.visible { display: block; }
  #setup strong { color: #f8fafc; }
  #setup p { margin: 0 0 8px; color: #cbd5e1; }
  #setup p:last-child { margin-bottom: 0; }
  .note { color: #94a3b8 !important; font-size: 12px; }
  #primaryRow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  details.advanced { margin: 0 20px 10px; color: #94a3b8; }
  details.advanced summary { cursor: pointer; font-size: 12px; color: #64748b; }
  .adv-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <div class="mark">&gt;_</div>
  <div class="grow">
    <h1>DSH Desktop</h1>
    <div class="sub" id="subtitle">Official DeepSeek Harness in a desktop window</div>
  </div>
  <div class="lang">
    <button id="langEn" class="secondary active" type="button">English</button>
    <button id="langZh" class="secondary" type="button">中文</button>
  </div>
</header>
<div id="identity"></div>
<div class="status"><span class="dot starting" id="dot"></span><span id="statusText">Checking this machine…</span></div>
<div id="setup">
  <p><strong id="setupTitle">DeepSeek Harness is not on this PC yet</strong></p>
  <p id="setupBody">This window does not include Harness.</p>
  <p class="note" id="setupKey"></p>
  <p class="note" id="setupLang"></p>
  <p id="setupDetail"></p>
  <div id="primaryRow">
    <button id="primary" type="button">Install runtime and official Harness</button>
  </div>
</div>
<details class="advanced" id="advanced">
  <summary id="advancedLabel">Advanced</summary>
  <div class="adv-row">
    <button id="reprobe" class="secondary" type="button">Check again</button>
    <button id="bundledNode" class="secondary" type="button">Install app-local Node only</button>
    <button id="nodejs" class="secondary" type="button">Install system Node.js from nodejs.org</button>
    <button id="pickFolder" class="secondary" type="button">Choose Harness folder…</button>
    <button id="editConfig" class="secondary" type="button">Edit config.json</button>
    <button id="restart" class="secondary" type="button">Restart backend</button>
  </div>
</details>
<div id="progress"><div class="bar"></div></div>
<div class="log-label" id="logLabel">Log</div>
<pre id="log"></pre>
<footer>
  <span class="hint" id="hint">Install needs network · API key is in the official UI · F12 for DevTools</span>
</footer>
<script>
  const logEl = document.getElementById('log');
  const dotEl = document.getElementById('dot');
  const statusEl = document.getElementById('statusText');
  const setupEl = document.getElementById('setup');
  const setupDetail = document.getElementById('setupDetail');
  const primaryBtn = document.getElementById('primary');
  const bundledBtn = document.getElementById('bundledNode');
  let primaryAction = 'runtime';
  const progressEl = document.getElementById('progress');
  const identityEl = document.getElementById('identity');
  const MAX_DOM_LINES = 500;
  let S = {};
  let lastProbe = null;
  let lastStatus = null;
  let lastIdentity = null;

  function fill(key, vars) {
    let text = S[key] || key;
    for (const [name, value] of Object.entries(vars || {})) text = text.split('{' + name + '}').join(String(value ?? ''));
    return text;
  }

  function kindText(kind) {
    if (kind === 'checkout') return fill('kindCheckout');
    if (kind === 'runtime') return fill('kindRuntime');
    if (kind === 'path') return fill('kindPath');
    return fill('identityMissing');
  }

  function setProgress(on) {
    progressEl.classList.toggle('visible', on);
  }

  function applyStatic() {
    document.documentElement.lang = document.documentElement.dataset.locale === 'zh' ? 'zh-CN' : 'en';
    document.getElementById('subtitle').textContent = fill('subtitle');
    document.getElementById('setupTitle').textContent = fill('setupTitle');
    document.getElementById('setupBody').textContent = fill('setupBody');
    document.getElementById('setupKey').textContent = fill('setupKey');
    document.getElementById('setupLang').textContent = fill('setupLang');
    document.getElementById('advancedLabel').textContent = fill('advanced');
    document.getElementById('reprobe').textContent = fill('reprobe');
    document.getElementById('bundledNode').textContent = fill('installBundledNode');
    document.getElementById('nodejs').textContent = fill('installNode');
    document.getElementById('pickFolder').textContent = fill('pickFolder');
    document.getElementById('editConfig').textContent = fill('editConfig');
    document.getElementById('restart').textContent = fill('restart');
    document.getElementById('hint').textContent = fill('hint');
    document.getElementById('logLabel').textContent = fill('logLabel');
    const locale = document.documentElement.dataset.locale || 'en';
    document.getElementById('langEn').classList.toggle('active', locale === 'en');
    document.getElementById('langZh').classList.toggle('active', locale === 'zh');
    if (lastIdentity) renderIdentity(lastIdentity);
    if (lastStatus) renderStatus(lastStatus);
    if (lastProbe) renderProbe(lastProbe);
  }

  function applyBundle(bundle) {
    S = bundle.strings;
    document.documentElement.dataset.locale = bundle.locale;
    if (bundle.identity) lastIdentity = bundle.identity;
    applyStatic();
  }

  function append(line) {
    logEl.textContent += line + '\n';
    const lines = logEl.textContent.split('\n');
    if (lines.length > MAX_DOM_LINES) logEl.textContent = lines.slice(-MAX_DOM_LINES).join('\n');
    logEl.scrollTop = logEl.scrollHeight;
  }

  function renderIdentity(id) {
    lastIdentity = id;
    const parts = [fill('identityShell', { version: id.shellVersion || '' })];
    if (!id.harness || id.harness.kind === 'missing') parts.push(fill('identityMissing'));
    else {
      parts.push(fill('identityHarness', {
        version: id.harness.version || '—',
        kind: kindText(id.harness.kind),
      }));
    }
    if (id.node && id.node.version) {
      const source = id.node.source === 'bundled' ? fill('nodeSourceBundled') : fill('nodeSourceSystem');
      parts.push(fill('identityNode', { version: id.node.version, source }));
    }
    if (id.harness && id.harness.detail) parts.push(id.harness.detail);
    identityEl.textContent = parts.join(' · ');
  }

  function renderStatus(status) {
    lastStatus = status;
    dotEl.className = 'dot';
    if (status.state === 'starting') { dotEl.classList.add('starting'); statusEl.textContent = fill('starting'); }
    else if (status.state === 'ready') { dotEl.classList.add('ready'); statusEl.textContent = fill('ready', { url: status.url }); }
    else if (status.state === 'restarting') { dotEl.classList.add('starting'); statusEl.textContent = fill('restarting', { sec: Math.round((status.delayMs || 0) / 1000), n: status.attempts }); }
    else if (status.state === 'failed') { dotEl.classList.add('bad'); statusEl.textContent = fill('failed'); }
    else if (status.state === 'stopped') { dotEl.classList.add('bad'); statusEl.textContent = fill('stopped'); }
  }

  function renderProbe(probe) {
    lastProbe = probe;
    const missing = probe.harness.kind === 'missing';
    const nodeOk = probe.node.ok;
    const nodeSource = probe.node.source === 'bundled' ? fill('nodeSourceBundled') : fill('nodeSourceSystem');
    setupEl.classList.toggle('visible', missing || !nodeOk);
    bundledBtn.style.display = probe.node.source === 'bundled' ? 'none' : '';
    if (!nodeOk) {
      primaryAction = 'runtime';
      primaryBtn.style.display = '';
      primaryBtn.disabled = false;
      primaryBtn.textContent = fill('installRuntime');
      setupDetail.textContent = probe.node.reason;
      statusEl.textContent = fill('needNode');
      dotEl.className = 'dot bad';
      return;
    }
    if (missing) {
      primaryAction = 'deploy';
      primaryBtn.style.display = '';
      primaryBtn.disabled = false;
      primaryBtn.textContent = fill('deploy');
      setupDetail.textContent = fill('nodeOkDeploy', { version: probe.node.version, source: nodeSource });
      statusEl.textContent = fill('missingHarness');
      dotEl.className = 'dot';
    } else {
      primaryBtn.style.display = 'none';
      setupDetail.textContent = fill('foundHarness', {
        kind: kindText(probe.harness.kind),
        version: probe.harness.version ? 'v' + probe.harness.version : '',
        detail: probe.harness.detail,
      });
    }
  }

  async function setLang(locale) {
    applyBundle(await window.dshShell.setLocale(locale));
  }

  window.dshShell.getUi().then(applyBundle);
  window.dshShell.getIdentity().then(renderIdentity);
  window.dshShell.onLocale(applyBundle);
  window.dshShell.onIdentity(renderIdentity);
  window.dshShell.onProbe(renderProbe);
  window.dshShell.getSnapshot().then(snapshot => {
    snapshot.lines.forEach(append);
    renderStatus(snapshot);
  });
  window.dshShell.probe().then(renderProbe);
  window.dshShell.onLog(append);
  window.dshShell.onStatus(status => {
    renderStatus(status);
    if (status.state === 'failed') window.dshShell.probe().then(renderProbe);
  });
  document.getElementById('restart').addEventListener('click', () => { window.dshShell.restart(); });
  document.getElementById('nodejs').addEventListener('click', () => { window.dshShell.openNodejs(); });
  document.getElementById('editConfig').addEventListener('click', () => { window.dshShell.openConfig(); });
  document.getElementById('langEn').addEventListener('click', () => { setLang('en'); });
  document.getElementById('langZh').addEventListener('click', () => { setLang('zh'); });
  document.getElementById('pickFolder').addEventListener('click', async () => {
    const result = await window.dshShell.pickHarness();
    if (result && result.ok) {
      if (result.needsNode) {
        statusEl.textContent = fill('needNode');
        return;
      }
      setupEl.classList.remove('visible');
      statusEl.textContent = fill('pickOk', { detail: result.detail });
      dotEl.className = 'dot starting';
    }
  });
  document.getElementById('reprobe').addEventListener('click', async () => {
    statusEl.textContent = fill('reprobing');
    const probe = await window.dshShell.reprobeAndStart();
    renderProbe(probe);
    if (probe.harness.kind !== 'missing' && probe.node.ok) {
      setupEl.classList.remove('visible');
      statusEl.textContent = fill('foundStarting');
      dotEl.className = 'dot starting';
    }
  });
  async function runPrimary() {
    primaryBtn.disabled = true;
    setProgress(true);
    const installingRuntime = primaryAction === 'runtime';
    statusEl.textContent = fill(installingRuntime ? 'installingRuntime' : 'deploying');
    dotEl.className = 'dot starting';
    const result = installingRuntime
      ? await window.dshShell.installRuntimeAndHarness()
      : await window.dshShell.deployOfficial();
    setProgress(false);
    if (result && result.cancelled) {
      primaryBtn.disabled = false;
      statusEl.textContent = fill('deployCancelled');
      dotEl.className = 'dot';
      return;
    }
    if (result && result.ok) {
      setupEl.classList.remove('visible');
      statusEl.textContent = fill('deployed');
    } else {
      primaryBtn.disabled = false;
      statusEl.textContent = fill('deployFailed', { error: (result && result.error) || '' });
      dotEl.className = 'dot bad';
      if (result && result.error) append(result.error);
    }
  }
  primaryBtn.addEventListener('click', () => { void runPrimary(); });
  bundledBtn.addEventListener('click', async () => {
    bundledBtn.disabled = true;
    setProgress(true);
    statusEl.textContent = fill('installingBundled');
    const result = await window.dshShell.installBundledNode();
    setProgress(false);
    bundledBtn.disabled = false;
    if (result && result.cancelled) {
      statusEl.textContent = fill('deployCancelled');
      return;
    }
    if (result && result.ok) {
      statusEl.textContent = fill('bundledInstalled');
      const probe = await window.dshShell.probe();
      renderProbe(probe);
    } else {
      statusEl.textContent = fill('deployFailed', { error: (result && result.error) || '' });
      dotEl.className = 'dot bad';
      if (result && result.error) append(result.error);
    }
  });
</script>
</body>
</html>
