name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# 同一 tag 只允许一个发布任务，避免与手动发布或重复推送撞车。
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build NSIS
        run: pnpm run dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          make_latest: true
          name: DSH Desktop ${{ github.ref_name }}
          body: |
            Desktop shell around official `dsh web`. This package updates the shell only; it does not fork or embed DeepSeek Harness.

            壳核分离桌面外壳。本包只更新壳，不内嵌、不 fork DeepSeek Harness。

            First run can install an app-local official Node (not on PATH) plus `@deepseek-ai/dsh`, or use a system Node 22.19+/24. Closing the window hides to the tray — quit from the cyan `>_` icon.

            首次可安装本应用官方 Node（不写入 PATH）和 `@deepseek-ai/dsh`，或使用系统 Node 22.19+/24。关窗进托盘；退出请右键青色 `>_` 图标。

            The installer is unsigned. If SmartScreen appears: More info → Run anyway.
            安装包未签名，SmartScreen 提示时点「更多信息 → 仍要运行」。
          files: |
            dist/DSH-Desktop-Setup-*.exe
            dist/DSH-Desktop-Setup-*.exe.blockmap
            dist/latest.yml
          fail_on_unmatched_files: true
