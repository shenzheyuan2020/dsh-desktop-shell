name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build NSIS
        run: pnpm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v$((Get-Content package.json | ConvertFrom-Json).version)" }
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          $notes = @"
          DSH Desktop $ver —— 壳核分离桌面外壳。
          安装后双击即可加载本机官方 ``dsh web`` 原生界面；本包只更新壳，不内嵌、不 fork DeepSeek Harness。
          "@
          $assets = Get-ChildItem dist -File | Where-Object { $_.Name -match 'DSH-Desktop-Setup|\.yml$|\.blockmap$' } | ForEach-Object { $_.FullName }
          if (-not $assets) { throw 'no release assets in dist/' }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title "DSH Desktop $ver" --notes $notes
          }
